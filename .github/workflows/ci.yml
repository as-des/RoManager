name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/RoManager.App/RoManager.App.csproj

      - name: Build
        run: dotnet build src/RoManager.App/RoManager.App.csproj -c Release -p:Platform=x64 --no-restore
