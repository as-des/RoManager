name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish win-x64
        run: >
          dotnet publish src/RoManager.App/RoManager.App.csproj
          -c Release -r win-x64 --self-contained true -p:Platform=x64
          -o publish

      - name: Prepare package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item README.md,README.ru.md,LICENSE -Destination publish
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish\* -DestinationPath "dist/RoManager-win-x64-$tag.zip" -Force
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii dist/sha256sums.txt

          $notes = ".github/releases/$tag.md"
          if (Test-Path $notes) {
            Copy-Item $notes release-notes.md
          } else {
            "RoManager $tag" | Set-Content release-notes.md
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RoManager ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.zip
            dist/sha256sums.txt
