name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Publish win-x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish

      - name: Prepare package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item README.md,LICENSE -Destination publish
          Compress-Archive -Path publish\* -DestinationPath "dist/RoManager-win-x64-$tag.zip" -Force
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii dist/sha256sums.txt
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RoManager ${{ env.TAG }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/sha256sums.txt
          body: |
            ## RoManager ${{ env.TAG }}

            Портативная сборка для Windows 10/11 x64 (.NET 8 включён).

            1. Скачайте `RoManager-win-x64-${{ env.TAG }}.zip` и `sha256sums.txt`.
            2. Распакуйте архив в любую папку.
            3. Запустите `RoManager.exe`.

            Требуется [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)
            (в Windows 11 уже установлен).

            Не связан с Roblox Corporation. Лицензия MIT.
