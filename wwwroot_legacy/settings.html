<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Settings — RoManager</title>
<style>
  :root {
    --bg: #0a0a0a; --card: #141414; --border: #222;
    --text: #fff; --muted: #888; --muted2: #666;
    --primary: #3b82f6; --primary-hover: #2563eb;
    --radius: 14px; --radius-sm: 10px;
    --win-bg: #1e1e1e; --win-title: #2d2d2d; --win-border: #333;
    --win-text: #e0e0e0; --win-control-hover: #3a3a3a; --win-control-close: #e81123;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--win-bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; color: #e0e0e0; overflow: hidden; }

  .settings-window { width: 100%; height: 100%; background: var(--win-bg); display: flex; flex-direction: column; }
  .settings-titlebar {
    background: var(--win-title); height: 32px; display: flex; justify-content: space-between;
    align-items: center; padding-left: 12px; user-select: none; flex-shrink: 0;
  }
  .settings-titlebar span { font-size: 12px; color: var(--win-text); }
  .settings-titlebar .win-btn { width: 46px; }
  .win-btn { width: 46px; height: 100%; background: transparent; border: none; color: #ccc;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; }
  .win-btn:hover { background: var(--win-control-hover); color: #fff; }
  .win-btn.close:hover { background: var(--win-control-close); color: #fff; }
  .win-btn svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1.5; fill: none; }
  .space { flex: 1; }

  .settings-tabs { display: flex; background: #252525; border-bottom: 1px solid #111; }
  .settings-tab {
    padding: 8px 16px; font-size: 13px; color: #aaa; cursor: pointer;
    border-right: 1px solid #111; background: #1e1e1e; transition: background .15s, color .15s;
  }
  .settings-tab:hover { background: #2a2a2a; color: #fff; }
  .settings-tab.active { background: #2d2d2d; color: #fff; border-bottom: 1px solid #2d2d2d; margin-bottom: -1px; }

  .settings-content { padding: 20px; background: #2d2d2d; flex: 1; overflow-y: auto; color: #e0e0e0; font-size: 13px; }
  .settings-pane { display: none; }
  .settings-pane.active { display: block; }

  .setting-item { display: flex; align-items: center; margin-bottom: 12px; }
  .setting-item input[type="checkbox"] { margin-right: 8px; accent-color: #3b82f6; width: 14px; height: 14px; }

  .setting-row-flex {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    gap: 12px;
  }
  .setting-row-flex label { flex: 1; }
  .setting-row-flex input[type="text"], .setting-row-flex input[type="number"], .setting-row-flex select {
    width: 100px; padding: 4px 6px; background: #1a1a1a; border: 1px solid #444; border-radius: 4px;
    color: #fff; font-size: 12px; text-align: right;
  }
  .setting-row-flex input[type="text"] { width: 160px; text-align: left; }
  .setting-row-flex span.label { margin-right: 0; white-space: nowrap; }
  .hint { font-size: 11px; color: #999; margin-top: 12px; }

  .settings-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-start; }
  .btn { font-size: 12px; background: #1e1e1e; border: 1px solid #444; color: #ddd; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; }
  .btn:hover { background: #333; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; padding: 8px 18px; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  .sec-title { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 10px; }
  .sec-title:first-child { margin-top: 0; }
</style>
</head>
<body>
  <div class="settings-window">
    <div class="settings-titlebar" id="titlebar">
      <span>Настройки — RoManager</span>
      <div class="space"></div>
      <button class="win-btn close" onclick="rom.closeSettingsWindow()">
        <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
      </button>
    </div>

    <div class="settings-tabs">
      <div class="settings-tab active" onclick="switchTab('general')">General</div>
      <div class="settings-tab" onclick="switchTab('developer')">Developer</div>
      <div class="settings-tab" onclick="switchTab('misc')">Miscellaneous</div>
    </div>

    <div class="settings-content">
      <!-- GENERAL -->
      <div class="settings-pane active" id="tab-general">
        <div class="sec-title">Сессия и аккаунты</div>

        <div class="setting-row-flex">
          <label>Автопроверка cookie (мин)</label>
          <input type="number" id="setAutoRecheck" min="1" max="1440" value="15">
        </div>
        <div class="setting-row-flex">
          <label>Задержка запуска, мс</label>
          <input type="number" id="setJoinDelay" min="0" max="30000" step="100" value="2500">
        </div>
        <div class="setting-item">
          <input type="checkbox" id="setAutoClose" checked>
          <label for="setAutoClose">Закрывать предыдущий Roblox перед запуском</label>
        </div>

        <div class="hint">Некоторые настройки применяются сразу, другие — при следующем запуске.</div>
      </div>

      <!-- DEVELOPER -->
      <div class="settings-pane" id="tab-developer">
        <div class="sec-title">Отладка</div>
        <div class="setting-item"><input type="checkbox" id="setDevLogMode"> <label for="setDevLogMode">Писать подробный лог (rom.log)</label></div>
        <div class="hint" style="font-size:11px;color:#999;">Влияет на мировые исключения и вывода в файл лога.</div>
      </div>

      <!-- MISC -->
      <div class="settings-pane" id="tab-misc">
        <div class="sec-title">Presence</div>
        <div class="setting-row-flex">
          <div class="setting-item" style="margin:0;">
            <input type="checkbox" id="setPresence" checked>
            <label for="setPresence">Показывать присутствие</label>
          </div>
          <span class="label">Обновление (сек)</span>
          <input type="number" id="setPresenceRate" min="5" max="600" value="30">
        </div>
        <div class="sec-title">FPS</div>
        <div class="setting-row-flex">
          <div class="setting-item" style="margin:0;">
            <input type="checkbox" id="setFpsUnl">
            <label for="setFpsUnl">Разблокировать FPS</label>
          </div>
          <span class="label">Макс FPS</span>
          <input type="number" id="setMaxFps" min="30" max="9999" value="120">
        </div>
        <div class="sec-title">Браузер</div>
        <div class="setting-item"><input type="checkbox" id="setCdpFallback" checked disabled> <label for="setCdp">Встраивать Chrome (chrome-win64)</label></div>
      </div>
    </div>

    <div style="padding: 16px 20px; background: #2d2d2d; border-top: 1px solid #111;">
      <button class="btn btn-primary" id="saveBtn" onclick="saveSettings()">Сохранить настройки</button>
      <button class="btn" onclick="rom.closeSettingsWindow()" style="margin-left: 10px;">Отмена</button>
    </div>
  </div>

<script>
  const rom = window.chrome?.webview?.hostObjects?.rom;
  document.getElementById('titlebar').addEventListener('mousedown', (e) => {
    if (!rom) return;
    if (e.target.closest('.win-btn')) return; // крестик не должен начинать перетаскивание
    rom.dragSettings();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && rom) rom.closeSettingsWindow();
  });

  function switchTab(id) {
    document.querySelectorAll('.settings-tab').forEach((t, i) => t.classList.toggle('active',
      ['general','developer','misc'][i] === id));
    document.querySelectorAll('.settings-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + id));
  }

  const fields = {
    setPresenceRate:  'presenceRateSec',
    setAutoRecheck:   'autoRecheckMin',
    setJoinDelay:     'joinDelayMs',
    setAutoClose:     'autoCloseLast',
    setFpsUnl:        'unlockFps',
    setMaxFps:        'maxFps',
    setPresence:      'sharePresence'
  };

  (async function init() {
    try {
      const s = JSON.parse(await rom.getSettings());
      for (const [id, key] of Object.entries(fields)) {
        const el = document.getElementById(id);
        if (!el) continue;
        if (el.type === 'checkbox') el.checked = !!s[key];
        else el.value = s[key] ?? el.value;
      }
      const dev = document.getElementById('setDevLogMode');
      if (dev) dev.checked = !!(s.devLogMode);
    } catch { console.warn('[RoManager] настройки не прочитаны'); }
  })();

  function collect() {
    const s = {};
    s.presenceRateSec = clamp(parseInt(document.getElementById('setPresenceRate').value || '30'), 5, 600);
    s.autoRecheckMin  = clamp(parseInt(document.getElementById('setAutoRecheck').value || '15'), 1, 1440);
    s.joinDelayMs     = clamp(parseInt(document.getElementById('setJoinDelay').value || '2500'), 0, 30000);
    s.autoCloseLast   = !!document.getElementById('setAutoClose').checked;
    s.unlockFps       = !!document.getElementById('setFpsUnl').checked;
    s.maxFps          = clamp(parseInt(document.getElementById('setMaxFps').value || '120'), 30, 9999);
    s.sharePresence   = !!document.getElementById('setPresence').checked;
    s.devLogMode      = !!document.getElementById('setDevLogMode').checked;
    return s;
  }

  function clamp(v, a, b) { if (isNaN(v)) return a; return Math.min(b, Math.max(a, v)); }

  async function saveSettings() {
    document.getElementById('saveBtn').disabled = true;
    const json = JSON.stringify(collect());
    await rom.saveSettings(json);
    document.getElementById('saveBtn').disabled = false;
    setTimeout(() => rom.closeSettingsWindow(), 600);
  }
</script>
</body>
</html>
